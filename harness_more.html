<!doctype html><html><head><style>
.myed-tool{position:relative;overflow:visible}.myed-more{cursor:pointer}.myed-pop{display:none;position:fixed;background:white;z-index:9999}.myed-tool.more-open .myed-pop{display:block}.myed-picks label{cursor:pointer}.myed-picks input{position:absolute;opacity:0;pointer-events:none}.chip{display:inline-block;padding:6px}
</style></head><body><div id="myedBodyWrap"><div class="myed-tool" id="colorTool"><div class="myed-tool-head"><strong>Colour</strong><button type="button" class="myed-more" onclick="toggleEdPop(this)">More</button></div><div class="myed-picks"><label><input type="radio" name="color" value="yellow" checked><span class="chip">Yellow</span></label></div><div class="myed-pop"><div class="myed-picks"><label><input type="radio" name="color" value="red"><span class="chip">Red</span></label><label><input type="radio" name="color" value="purple"><span class="chip">Purple</span></label></div></div></div>
<div class="myed-tool"><div class="myed-tool-head"><strong>Style</strong><button type="button" class="myed-more" onclick="toggleEdPop(this)">More styles</button></div><div class="myed-picks"><label><input type="radio" name="font_style" value="bold" checked><span class="chip">Bold</span></label></div><div class="myed-pop"><div class="myed-picks"><label><input type="radio" name="font_style" value="serif"><span class="chip">Classic</span></label></div></div></div>
<div class="myed-tool"><div class="myed-tool-head"><strong>Shape</strong><button type="button" class="myed-more" onclick="toggleEdPop(this)">More</button></div><div class="myed-picks"><label><input type="radio" name="shape_style" value="sticky" checked><span class="chip">Sticky</span></label></div><div class="myed-pop"><div class="myed-picks"><label><input type="radio" name="shape_style" value="circle"><span class="chip">Circle</span></label></div></div></div>
<div class="myed-tool"><div class="myed-tool-head"><strong>Badge</strong><button type="button" class="myed-more" onclick="toggleEdPop(this)">More</button></div><div class="myed-picks"><label><input type="radio" name="decoration" value="spark" checked><span class="chip">Spark</span></label></div><div class="myed-pop"><div class="myed-picks"><label><input type="radio" name="decoration" value="verified"><span class="chip">Blue celebrity</span></label></div></div></div>
</div>
<div id="myedCard"></div><div id="myedTitleOut"></div><div id="myedBodyOut"></div><div id="myedDeco"></div><div id="myedBrand"></div>
<input id="myedTitle"><input id="myedCardId"><input id="myedColor"><input id="myedFont"><input id="myedShape"><input id="myedDesign"><input id="myedSig"><input id="myedDecoration"><input id="myedAfter"><textarea id="myedBody"></textarea><form id="myedForm"></form><button id="myedTopSave"></button><button id="myedTopPng"></button>
<script>
document.body.classList.add('personal-route-body');
(()=>{
  const body=document.getElementById('myedBody');
  if(!body)return;
  const card=document.getElementById('myedCard'), tout=document.getElementById('myedTitleOut'), bout=document.getElementById('myedBodyOut'), deco=document.getElementById('myedDeco'), brand=document.getElementById('myedBrand');
  const hidTitle=document.getElementById('myedTitle'), hidId=document.getElementById('myedCardId'), hidColor=document.getElementById('myedColor'), hidFont=document.getElementById('myedFont'), hidShape=document.getElementById('myedShape'), hidDesign=document.getElementById('myedDesign'), hidSig=document.getElementById('myedSig'), hidDec=document.getElementById('myedDecoration'), after=document.getElementById('myedAfter');
  const topSave=document.getElementById('myedTopSave'), topPng=document.getElementById('myedTopPng');
  let writeMode='topic',topicText='',bodyText='';
  const get=n=>document.querySelector('input[name='+n+']:checked')?.value||'';
  const decoMap={spark:'✦',sun:'☼',moon:'☾',heart:'♡',bird:'⌁',dots:'•••',none:'',verified:'✓',starblue:'★',checkblue:'✓',crownblue:'♛',diamond:'◆',bolt:'⚡',burst:'✹',seal:'●'};
  const blueDecos=new Set(['verified','starblue','checkblue','crownblue','diamond','bolt','burst','seal']);
  const hasTypedText=()=>Boolean((writeMode==='topic'?body.value:body.value).trim() || hidTitle.value.trim());
  const syncSaveButtons=()=>{const enabled=hasTypedText();[topSave,topPng].forEach(b=>{if(b)b.disabled=!enabled});};
  window.setWriteMode=m=>{
    if(writeMode==='topic')topicText=body.value.trim(); else bodyText=body.value.trim();
    writeMode=m;
    body.value=m==='topic'?topicText:bodyText;
    document.querySelectorAll('.myed-write-mode button').forEach(b=>b.classList.toggle('active',b.dataset.mode===m));
    body.placeholder=m==='topic'?'Write the topic / big line…':'Write the body / smaller message…';
    paint();
  };
  let openTool=null;
  const closeOpen=()=>{
    if(!openTool)return;
    openTool.classList.remove('more-open');
    openTool.querySelector('.myed-more')?.setAttribute('aria-expanded','false');
    const pop=openTool.querySelector('.myed-pop');
    if(pop){pop.style.removeProperty('left');pop.style.removeProperty('top');pop.style.removeProperty('width');}
    openTool=null;
  };
  const positionPop=tool=>{
    const btn=tool.querySelector('.myed-more'), pop=tool.querySelector('.myed-pop'); if(!btn||!pop)return;
    const r=btn.getBoundingClientRect();
    const pw=Math.min(Math.max(tool.getBoundingClientRect().width-14,240),Math.min(380,window.innerWidth-16));
    pop.style.position='fixed'; pop.style.width=pw+'px';
    const measured=Math.min(pop.scrollHeight||190,420);
    const below=window.innerHeight-r.bottom-10;
    const top=below>=180 ? r.bottom+6 : Math.max(8,r.top-measured-6);
    const left=Math.min(Math.max(8,r.left),window.innerWidth-pw-8);
    pop.style.left=left+'px'; pop.style.top=top+'px';
  };
  window.toggleEdPop=btn=>{
    const tool=btn?.closest('.myed-tool'); if(!tool)return;
    if(openTool===tool){closeOpen();return;}
    closeOpen();
    tool.classList.add('more-open'); openTool=tool;
    btn.setAttribute('aria-expanded','true');
    positionPop(tool);
    requestAnimationFrame(()=>positionPop(tool));
  };
  document.querySelectorAll('.myed-more').forEach(btn=>{
    btn.setAttribute('aria-haspopup','true'); btn.setAttribute('aria-expanded','false');
  });
  document.addEventListener('click',e=>{
    if(e.target.closest('.myed-more') || e.target.closest('.myed-pop'))return;
    closeOpen();
  });
  window.addEventListener('scroll',()=>openTool&&positionPop(openTool),true);
  window.addEventListener('resize',()=>openTool&&positionPop(openTool));
  document.addEventListener('change',e=>{
    const input=e.target.closest('.myed-pop input');
    if(!input)return;
    closeOpen();
    paint();
  });
  function paint(){
    const c=get('color')||'yellow', f=get('font_style')||'bold', sh=get('shape_style')||'sticky', look=get('design_style')||'sunny', d=get('decoration')||'spark', sig=get('signature_enabled')!=='0';
    let title=writeMode==='topic'?(body.value.trim()||hidTitle.value.trim()):hidTitle.value.trim();
    let text=writeMode==='body'?body.value.trim():bodyText;
    if(writeMode==='topic')topicText=body.value.trim(); else bodyText=body.value.trim();
    card.className='myed-card '+c+' '+f+' '+sh+' '+look+' '+(title&&!text?'title-only':'')+' '+(!title&&text?'body-only':'');
    tout.textContent=title||''; bout.textContent=text||'';
    deco.textContent=decoMap[d]||'✦'; deco.classList.toggle('verified-badge',blueDecos.has(d)); brand.style.display=sig?'block':'none';
    hidColor.value=c; hidFont.value=f; hidShape.value=sh; hidDesign.value=look; hidSig.value=sig?'1':'0'; hidDec.value=d;
    syncSaveButtons();
  }
  window.newMyEdits=()=>{
    writeMode='topic';topicText='';bodyText='';body.value='';hidId.value='';hidTitle.value='';
    document.querySelectorAll('.myed-write-mode button').forEach(b=>b.classList.toggle('active',b.dataset.mode==='topic'));
    body.placeholder='Write the topic / big line…';paint();body.focus();
  };
  window.loadMyEdits=(id,title,b,c,f,sh,d,sig,dec)=>{
    hidId.value=id;
    document.querySelectorAll('input[name=color]').forEach(x=>x.checked=x.value===c);
    document.querySelectorAll('input[name=font_style]').forEach(x=>x.checked=x.value===f);
    document.querySelectorAll('input[name=shape_style]').forEach(x=>x.checked=x.value===sh);
    document.querySelectorAll('input[name=design_style]').forEach(x=>x.checked=x.value===d);
    document.querySelectorAll('input[name=decoration]').forEach(x=>x.checked=x.value===dec);
    document.querySelectorAll('input[name=signature_enabled]').forEach(x=>x.checked=x.value===String(sig));
    let duplicate=title&&b&&b.toLowerCase().startsWith(title.toLowerCase())&&title.trim()!==b.trim();
    if(duplicate){hidTitle.value='';topicText='';bodyText=b||'';writeMode='body';body.value=bodyText}
    else if(title&&b){hidTitle.value=title;topicText=title;bodyText=b;writeMode='body';body.value=b}
    else if(title){hidTitle.value=title;topicText=title;bodyText='';writeMode='topic';body.value=title}
    else{hidTitle.value='';topicText='';bodyText=b||'';writeMode='body';body.value=bodyText}
    document.querySelectorAll('.myed-write-mode button').forEach(x=>x.classList.toggle('active',x.dataset.mode===writeMode));
    body.placeholder=writeMode==='topic'?'Write the topic / big line…':'Write the body / smaller message…';paint();body.focus();
  };
  window.saveMyEdits=async afterMode=>{
    if(writeMode==='topic')topicText=body.value.trim(); else bodyText=body.value.trim();
    const title=(writeMode==='topic'?topicText:hidTitle.value.trim());
    const text=(writeMode==='body'?bodyText:'');
    if(!title&&!text){body.focus();return}
    hidTitle.value=title;
    body.value=text;
    after.value=afterMode;
    const form=document.getElementById('myedForm'),data=new FormData(form);
    body.value=(writeMode==='topic'?topicText:bodyText);
    paint();
    try{
      const r=await fetch(form.action,{method:'POST',body:data,headers:{'Accept':'application/json','X-Requested-With':'XMLHttpRequest'}}),j=await r.json();
      if(!j.ok)throw new Error(j.message||'Could not save');
      window.showMyEditsToast?.(j.message||'Saved');
      if(afterMode==='png'&&j.download_url){const a=document.createElement('a');a.href=j.download_url;a.download='';document.body.appendChild(a);a.click();a.remove()}
    }catch(e){window.showMyEditsToast?.(e.message||'Could not save')}
  };
  window.showMyEditsToast=t=>{let n=document.getElementById('myedToast');if(!n){n=document.createElement('div');n.id='myedToast';n.style.cssText='position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:120;background:#14211e;color:#fff;padding:8px 12px;border-radius:999px;font-size:10px;font-weight:900;box-shadow:0 4px 16px rgba(0,0,0,.2)';document.body.appendChild(n)}n.textContent=t;clearTimeout(n._t);n._t=setTimeout(()=>n.remove(),1700)};

  body.addEventListener('input',paint);
  paint();
})();
</script></body></html>
