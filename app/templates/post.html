{% extends 'base.html' %}{% block content %}<article class="post-detail">{% if post.image %}<div class="post-detail-image" style="background-image:url('{{ post.image }}')"></div>{% endif %}<div class="post-detail-copy"><div class="eyebrow">{{ post.category }}</div><h1>{{ post.title }}</h1><p class="lead">{{ post.excerpt }}</p><div class="preline">{{ post.body }}</div>{% if post.media_url %}<p><a class="button primary" href="{{ post.media_url }}" target="_blank" rel="noopener">Watch / open the media →</a></p>{% endif %}</div></article>{% endblock %}
