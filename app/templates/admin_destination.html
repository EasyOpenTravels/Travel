{% extends 'admin_base.html' %}{% block content %}<section class="form-page"><div class="form-card wide"><div class="eyebrow">PLACE WALL</div><h1>{{ 'Edit' if destination else 'Add' }} place.</h1><form method="post"><label>Name<input name="title" value="{{ destination.title if destination else '' }}" required></label><label>Hook<input name="subtitle" value="{{ destination.subtitle if destination else '' }}" required></label><label>Vibe / tags<input name="vibe" value="{{ destination.vibe if destination else '' }}" required></label><label>Starting price idea (admin only)<input type="number" name="price_from" value="{{ destination.price_from if destination else 0 }}"></label><label>Photo URL<input name="cover_image" value="{{ destination.cover_image if destination else '' }}" required></label><label>Photo credit<input name="credit" value="{{ destination.credit if destination else '' }}"></label><label>Source / license page<input name="source_url" value="{{ destination.source_url if destination else '' }}"></label><div class="field-grid"><label>Order<input type="number" name="sort_order" value="{{ destination.sort_order if destination else 0 }}"></label><label>Show<select name="active"><option value="1" {% if not destination or destination.active %}selected{% endif %}>Yes</option><option value="0" {% if destination and not destination.active %}selected{% endif %}>No</option></select></label></div><button class="button primary full">Save place</button></form></div></section>{% endblock %}
