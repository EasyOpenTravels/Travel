{% extends 'base.html' %}{% block content %}
<div class="saves-v3">
  <header class="saves-v3-top">
    <a class="saves-v3-back" href="{{ url_for('public.my_stuff') }}">My Stuff</a>
    <div class="saves-v3-title"><span>02 · SAVES</span><h1>Saves</h1></div>
    <button class="saves-v3-search-btn" type="button" onclick="document.getElementById('saveSearch').focus()">⌕</button>
  </header>
  <section class="saves-v3-search"><input id="saveSearch" type="search" placeholder="Search your saved numbers or codes…" autocomplete="off"></section>
  <main class="saves-v3-list" id="savesList">
    {% for item in copies %}
    <article class="save-v3-row" data-search="{{ (item.label ~ ' ' ~ item.value)|lower }}">
      <button class="save-v3-name" type="button" onclick="copyValue(this.closest('.save-v3-row').querySelector('.save-v3-value').textContent,this.closest('.save-v3-row').querySelector('.copy-state'))">{{ item.label }}</button>
      <button class="save-v3-value" type="button" onclick="copyValue(this.textContent,this.closest('.save-v3-row').querySelector('.copy-state'))">{{ item.value }}</button>
      <small class="copy-state">tap number to copy</small>
      <div class="save-v3-actions"><a href="{{ url_for('public.my_stuff_copy_paste',edit=item.id) }}#save">Edit</a><form method="post" action="{{ url_for('public.my_stuff_copy_delete',item_id=item.id) }}"><button>Delete</button></form></div>
    </article>
    {% else %}<div class="saves-v3-empty"><b>Nothing saved yet.</b><span>Your little list of tills, paybills, numbers and codes will live here.</span></div>{% endfor %}
  </main>
  <div class="saves-v3-sheet" id="saveSheet">
    <div class="saves-v3-sheet-label">NEW SAVE</div>
    <form method="post" action="{{ url_for('public.my_stuff_copy_save') }}" id="saveFormV4">
      <input type="hidden" name="item_id" value="{{ edit_item.id if edit_item else '' }}">
      <label>Name<input name="label" value="{{ edit_item.label if edit_item else '' }}" placeholder="My Till" required></label>
      <label>Number / code<input name="value" value="{{ edit_item.value if edit_item else '' }}" placeholder="0712… / 123456" required></label>
      <button class="saves-v3-save" type="submit">{{ 'Save changes' if edit_item else 'Save' }}</button>
    </form>
  </div>
  <button class="saves-v3-plus" type="button" aria-label="Add save" onclick="openSaveSheet()">＋</button>
</div>
{% endblock %}{% block scripts %}<script>
document.body.classList.add('personal-route-body','saves-v3-body');
const q=document.getElementById('saveSearch');q?.addEventListener('input',()=>{const s=q.value.toLowerCase().trim();document.querySelectorAll('.save-v3-row').forEach(r=>r.hidden=!!s&&!r.dataset.search.includes(s));});
async function copyValue(value,state){try{await navigator.clipboard.writeText(value)}catch{const t=document.createElement('textarea');t.value=value;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove()}if(state){state.textContent='Copied ✓';clearTimeout(state._timer);state._timer=setTimeout(()=>state.textContent='tap to copy',1100)}}
function openSaveSheet(){const s=document.getElementById('saveSheet');s?.classList.add('open');s?.querySelector('input[name=label]')?.focus()}
if(location.hash==='#save' || {{ 'true' if edit_item else 'false' }}) openSaveSheet();
const saveForm=document.getElementById('saveFormV4');saveForm?.addEventListener('submit',()=>{const b=saveForm.querySelector('button[type=submit]');if(b){b.disabled=true;b.textContent='Saving…';}});
</script>{% endblock %}
