{% extends 'base.html' %}{% block content %}
<div class="saves-v4">
  <header class="saves-v4-top"><a href="{{ url_for('public.my_stuff') }}" class="saves-v4-back">My Stuff</a><div><span>KEEP THE THINGS YOU USE</span><h1>My Saves</h1></div><div class="saves-v4-top-actions"><button type="button" class="saves-v4-search-button" onclick="document.getElementById('saveV4Search').focus()">⌕</button><a class="button secondary small" href="{{ url_for('public.my_stuff_copy_paste_download') }}">PDF</a></div></header>
  <div class="saves-v4-search"><input id="saveV4Search" type="search" placeholder="Search your references…" autocomplete="off"></div>
  <main class="saves-v4-list" id="savesV4List">
    {% for item in copies %}<article class="saves-v4-row" data-search="{{ (item.label ~ ' ' ~ item.value)|lower }}"><button class="saves-v4-name" type="button" onclick="copySaveV4(this.closest('.saves-v4-row').querySelector('.saves-v4-value').dataset.value,this.closest('.saves-v4-row').querySelector('.saves-v4-copy-state'))">{{ item.label }}</button><button class="saves-v4-value is-hidden" type="button" data-value="{{ item.value|e }}" data-hidden="1" onclick="copySaveV4(this.dataset.value,this.closest('.saves-v4-row').querySelector('.saves-v4-copy-state'))">••••••••</button><button class="saves-v4-reveal" type="button" aria-label="Show or hide value" onclick="toggleSaveValue(this)">Show</button><div class="saves-v4-actions"><a href="{{ url_for('public.my_stuff_copy_paste',edit=item.id) }}#save">Edit</a><form method="post" action="{{ url_for('public.my_stuff_copy_delete',item_id=item.id) }}"><button>×</button></form></div><small class="saves-v4-copy-state"></small></article>{% else %}<div class="saves-v4-empty"><b>Your useful references live here.</b><span>Tap + to keep a Till, Paybill, phone number, code or token.</span></div>{% endfor %}
  </main>
  <button class="saves-v4-plus" type="button" onclick="document.getElementById('saveV4Sheet').classList.add('open');document.getElementById('saveV4Label').focus()">＋</button>
  <section id="saveV4Sheet" data-edit="{{ '1' if edit_item else '0' }}" class="saves-v4-sheet"><div><span>NEW REFERENCE</span><button type="button" onclick="document.getElementById('saveV4Sheet').classList.remove('open')">×</button></div><form method="post" action="{{ url_for('public.my_stuff_copy_save') }}" id="saveV4Form"><input type="hidden" name="item_id" value="{{ edit_item.id if edit_item else '' }}"><label>Name<input id="saveV4Label" name="label" value="{{ edit_item.label if edit_item else '' }}" placeholder="My reference" required></label><label>Number / code<input name="value" value="{{ edit_item.value if edit_item else '' }}" placeholder="123456…" required></label><button class="saves-v4-save" type="submit">Save reference</button></form></section>
</div>
<style>.saves-v4-row{grid-template-columns:minmax(92px,.7fr) minmax(0,1.2fr) auto auto}.saves-v4-value.is-hidden{letter-spacing:.18em}.saves-v4-reveal{border:0;background:transparent;color:var(--muted);font-weight:800;font-size:11px;cursor:pointer;padding:8px}.saves-v4-reveal:hover{color:var(--ink)}@media(max-width:700px){.saves-v4-row{grid-template-columns:minmax(86px,.75fr) minmax(0,1fr) auto}.saves-v4-actions{grid-column:2 / -1;justify-content:end}.saves-v4-reveal{align-self:center}}</style>
{% endblock %}{% block scripts %}<script>
(function () {
  document.body.classList.add('personal-route-body', 'saves-v4-body');
  const sq = document.getElementById('saveV4Search');
  if (sq) {
    sq.addEventListener('input', function () {
      const q = sq.value.toLowerCase().trim();
      document.querySelectorAll('.saves-v4-row').forEach(function (r) {
        r.hidden = Boolean(q) && !r.dataset.search.includes(q);
      });
    });
  }
  window.toggleSaveValue = function (btn) {
    const row = btn.closest('.saves-v4-row'); const value = row && row.querySelector('.saves-v4-value'); if (!value) return;
    const hidden = value.dataset.hidden === '1'; value.dataset.hidden = hidden ? '0' : '1'; value.classList.toggle('is-hidden', !hidden); value.textContent = hidden ? value.dataset.value : '••••••••'; btn.textContent = hidden ? 'Hide' : 'Show';
  };
  window.copySaveV4 = async function (v, state) {
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) await navigator.clipboard.writeText(v);
      else throw new Error('clipboard unavailable');
    } catch (e) {
      const t = document.createElement('textarea');
      t.value = v;
      document.body.appendChild(t);
      t.select();
      document.execCommand('copy');
      t.remove();
    }
    if (state) { state.textContent = 'Copied ✓'; setTimeout(function () { state.textContent = ''; }, 1200); }
  };
  const sheet = document.getElementById('saveV4Sheet');
  const form = document.getElementById('saveV4Form');
  if (sheet && (location.hash === '#save' || sheet.dataset.edit === '1')) sheet.classList.add('open');
  if (form) {
    form.addEventListener('submit', function (e) {
      const b = e.currentTarget.querySelector('button[type=submit]');
      if (b) b.disabled = true;
    });
  }
})();
</script>
