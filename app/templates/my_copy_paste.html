{% extends 'base.html' %}{% block content %}
<div class="saves-phone-app">
  <header class="saves-top"><a class="saves-back" href="{{ url_for('public.my_stuff') }}">My Stuff</a><h1>Saves</h1><button class="saves-plus" type="button" onclick="document.getElementById('saveSheet').classList.add('open')">＋</button></header>
  <section class="saves-search-wrap"><input id="saveSearch" type="search" placeholder="Search saved numbers &amp; codes…"></section>
  <main class="saves-list" id="savesList">
    {% for item in copies %}<article class="save-item" data-search="{{ (item.label ~ ' ' ~ item.value)|lower }}"><div><strong>{{ item.label }}</strong><code>{{ item.value }}</code></div><div class="save-item-actions"><button class="save-copy-btn" data-value="{{ item.value|e }}">Copy</button><a href="{{ url_for('public.my_stuff_copy_paste',edit=item.id) }}#save">Edit</a><form method="post" action="{{ url_for('public.my_stuff_copy_delete',item_id=item.id) }}"><button type="submit">Delete</button></form></div></article>{% else %}<div class="saves-empty">Your saved numbers and codes will sit here.</div>{% endfor %}
  </main>
  <div class="save-sheet" id="saveSheet"><button class="save-sheet-close" type="button" onclick="document.getElementById('saveSheet').classList.remove('open')">×</button><form method="post" action="{{ url_for('public.my_stuff_copy_save') }}"><input type="hidden" name="item_id" value="{{ edit_item.id if edit_item else '' }}"><label>Name<input name="label" value="{{ edit_item.label if edit_item else '' }}" placeholder="Home Till" required></label><label>Number / code<input name="value" value="{{ edit_item.value if edit_item else '' }}" placeholder="Paste it here" required></label><button class="saves-save-btn">{{ 'Update' if edit_item else 'Save' }}</button></form></div>
</div>
{% endblock %}{% block scripts %}<script>document.body.classList.add('personal-route-body','saves-route-body');const q=document.getElementById('saveSearch');q?.addEventListener('input',()=>{const s=q.value.toLowerCase().trim();document.querySelectorAll('.save-item').forEach(r=>r.hidden=!!s&&!r.dataset.search.includes(s))});document.querySelectorAll('.save-item').forEach(r=>{let t;const start=()=>t=setTimeout(()=>r.classList.add('show-more'),520),end=()=>clearTimeout(t);r.addEventListener('touchstart',start,{passive:true});r.addEventListener('touchend',end,{passive:true});r.addEventListener('touchmove',end,{passive:true})});document.querySelectorAll('.save-copy-btn').forEach(b=>b.onclick=async()=>{try{await navigator.clipboard.writeText(b.dataset.value)}catch{const t=document.createElement('textarea');t.value=b.dataset.value;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove()}const x=b.textContent;b.textContent='Copied';setTimeout(()=>b.textContent=x,1000)});if(location.hash==='#save')document.getElementById('saveSheet').classList.add('open');</script>{% endblock %}
