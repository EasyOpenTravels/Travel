{% extends 'admin_base.html' %}{% block content %}<section class="form-page"><div class="form-card wide"><div class="eyebrow">TRIP BUILDER</div><h1>{{ 'Edit' if trip else 'Create' }} adventure.</h1><form method="post"><div class="field-grid"><label>Trip title<input name="title" value="{{ trip.title if trip else '' }}" required></label><label>Destination<input name="destination" value="{{ trip.destination if trip else '' }}" required></label><label>Date<input type="date" name="date" value="{{ trip.date if trip else '' }}" required></label><label>Price<input type="number" name="price" value="{{ trip.price if trip else 0 }}" min="0" required></label><label>Capacity<input type="number" name="capacity" value="{{ trip.capacity if trip else 40 }}" min="1" required></label><label>Status<select name="status"><option {% if trip and trip.status=='draft' %}selected{% endif %}>draft</option><option {% if not trip or trip.status=='published' %}selected{% endif %}>published</option><option {% if trip and trip.status=='completed' %}selected{% endif %}>completed</option></select></label></div><label>Description<textarea name="description" rows="4" required>{{ trip.description if trip else '' }}</textarea></label><label>Cover image URL<input name="cover_image" value="{{ trip.cover_image if trip else '' }}" required></label><label>Gallery image URLs<textarea name="gallery" rows="3" placeholder="One URL per line">{{ trip.gallery if trip else '' }}</textarea></label><label>Pickup points<input name="pickup" value="{{ trip.pickup if trip else '' }}"></label><label>Itinerary<textarea name="itinerary" rows="8">{{ trip.itinerary if trip else '' }}</textarea></label><label>Included<textarea name="included" rows="5">{{ trip.included if trip else '' }}</textarea></label><label>Not included<textarea name="excluded" rows="5">{{ trip.excluded if trip else '' }}</textarea></label><button class="button primary full">Save adventure</button></form></div></section>{% endblock %}
