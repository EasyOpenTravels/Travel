{% extends 'base.html' %}{% block content %}<section class="form-page"><div class="form-card"><div class="eyebrow">POST-TRIP CHECK</div><h1>Would you do {{ trip.title }} again?</h1><p class="lead">Current: <b>{{ stats.avg or '—' }}/5</b> from {{ stats.n }} vote{{ '' if stats.n==1 else 's' }}.</p><form method="post"><label>Rating<select name="rating"><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option></select></label><label>Would you go again?<select name="choice"><option>Absolutely</option><option>Maybe</option><option>Not this one</option></select></label><label>What should we know?<textarea name="comment" rows="5"></textarea></label><button class="button primary full">Cast my vote</button></form></div></section>{% endblock %}
