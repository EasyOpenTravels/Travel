{% extends 'base.html' %}{% block content %}<section class="form-page"><div class="form-card wide"><div class="eyebrow">THE ADVENTURE TEAM</div><h1>Tell us what you need.</h1><p class="lead">Private retreat? School team? Birthday crew? A place you have been dying to visit? Send it over.</p><form method="post"><div class="field-grid"><label>Name<input name="name" value="{{ session.get('user_name','') }}" required></label><label>Phone<input name="phone" required></label><label>Email<input name="email" type="email" required></label></div><label>Your message<textarea name="body" rows="7" placeholder="What are you planning? Where do you want to go? How many people?" required></textarea></label><button class="button primary">Send to the Adventure Team</button></form></div></section>{% endblock %}
