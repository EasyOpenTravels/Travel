{% extends 'admin_base.html' %}{% block content %}<section class="form-page"><div class="form-card wide"><div class="eyebrow">ROAD JOURNAL</div><h1>{{ 'Edit' if post else 'Publish' }} a story.</h1><p class="lead">Use this for old-trip posts, photos, videos, testimonials, announcements and “look where we went” content.</p><form method="post"><label>Title<input name="title" value="{{ post.title if post else '' }}" required></label><label>One-line hook<input name="excerpt" value="{{ post.excerpt if post else '' }}"></label><label>Story<textarea name="body" rows="12" required>{{ post.body if post else '' }}</textarea></label><label>Cover image URL<input name="image" value="{{ post.image if post else '' }}"></label><label>Video / media URL<input name="media_url" value="{{ post.media_url if post else '' }}"></label><label>Category<input name="category" value="{{ post.category if post else 'From the road' }}"></label><label>Visible<select name="published"><option value="1" {% if not post or post.published %}selected{% endif %}>Yes</option><option value="0" {% if post and not post.published %}selected{% endif %}>No</option></select></label><button class="button primary full">Save post</button></form></div></section>{% endblock %}
