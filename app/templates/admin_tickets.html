{% extends 'admin_base.html' %}{% block content %}<section class="section"><div class="eyebrow">CHECK-IN</div><h1>Issued tickets.</h1><div class="table-wrap"><table><thead><tr><th>Ticket</th><th>Passenger</th><th>Trip</th><th>Seat</th><th>Status</th><th>Checked in</th></tr></thead><tbody>{% for t in tickets %}<tr><td>{{t.ticket_code}}</td><td>{{t.name}}</td><td>{{t.title}}</td><td>{{t.seat}}</td><td class="status {{t.status}}">{{t.status}}</td><td>{{t.checked_in_at or '—'}}</td></tr>{% endfor %}</tbody></table></div></section>{% endblock %}
