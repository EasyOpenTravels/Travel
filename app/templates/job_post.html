{% extends 'base.html' %}
{% block content %}<section class="form-page job-post-page"><div class="form-card wide"><div class="eyebrow">EMPLOYER POST</div><h1>Put a job<br>in front of people.</h1><p class="lead">Your post gets placed before external search results for the country you select. An Open Road ID is required so the post has an owner.</p><form method="post" class="job-post-form"><div class="field-grid"><label>Job title<input name="title" required placeholder="Delivery driver"></label><label>Company / shop<input name="company" placeholder="Company name"></label><label>Country<input name="country" list="countryList" value="Kenya" required></label><datalist id="countryList">{% for c in countries %}<option value="{{ c }}">{% endfor %}</datalist><label>City / area<input name="location" placeholder="Nairobi"></label><label>Employment type<select name="employment_type"><option>Full-time</option><option>Part-time</option><option>Contract</option><option>Temporary</option><option>Internship</option><option>Freelance</option></select></label><label>Pay / salary<input name="salary" placeholder="KES 25,000–35,000"></label></div><label>Description<textarea name="description" rows="7" required placeholder="What will the person do? What should they bring?"></textarea></label><label>Application link<input type="url" name="apply_url" required placeholder="https://…"></label><div class="button-row"><button class="button primary">Publish job</button><a class="button secondary" href="{{ url_for('public.jobs') }}">Back to jobs</a></div></form></div></section>{% endblock %}
