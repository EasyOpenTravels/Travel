{% extends 'base.html' %}{% block content %}<div class="journal-reader-shell"><div class="journal-reader-top"><a class="back-link" href="{{ url_for('public.my_stuff_journal',entry=entry.id) }}">← Back to My Journal</a></div><article class="journal-reader-card {{ entry.cover_color }}"><div class="journal-reader-meta"><span>{{ entry.mood|title }}</span><span>PRIVATE · ONLY YOU</span></div><h1>{{ entry.title }}</h1>{% if entry.tags %}<div class="journal-tags">{% for tag in entry.tags.split(',') %}<span>{{ tag.strip() }}</span>{% endfor %}</div>{% endif %}<div class="journal-story">{{ entry.body }}</div><div class="journal-reader-actions"><a class="button primary" href="{{ url_for('public.my_stuff_journal',entry=entry.id) }}#editor">Edit</a><a class="button secondary" href="{{ url_for('public.my_stuff_journal') }}">My Journal</a></div></article></div>{% endblock %}
