{% extends 'admin_base.html' %}{% block content %}<section class="section"><div class="eyebrow">INBOX</div><h1>Messages from people planning something.</h1><div class="stack">{% for m in messages %}<div class="message-card"><div><b>{{m.name}}</b><span>{{m.email}} · {{m.phone}} · {{m.created_at}}</span></div><p>{{m.body}}</p><form method="post" action="{{url_for('admin.reply',message_id=m.id)}}"><textarea name="reply" rows="3" placeholder="Reply from the Adventure Team">{{m.admin_reply or ''}}</textarea><button class="button secondary small">Save reply</button></form></div>{else}<div class="empty">Inbox clear.</div>{% endfor %}</div></section>{% endblock %}
