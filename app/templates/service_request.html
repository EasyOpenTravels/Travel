{% extends 'base.html' %}{% block content %}<section class="form-page"><div class="form-card wide"><span class="eyebrow">LET'S MAKE IT HAPPEN</span><h1>{{ service.title }}</h1><p>Give us the basics. We will come back to you with the useful next step.</p><form method="post"><div class="field-grid"><label>Name<input name="name" value="{{ user.name if user else '' }}" required></label><label>Phone<input name="phone" value="{{ user.phone if user else '' }}" required></label><label>Email<input type="email" name="email" value="{{ user.email if user else '' }}" required></label></div><div class="field-grid"><label>Event date<input type="date" name="event_date"></label><label>Expected guests<input type="number" min="1" max="100000" name="guest_count" value="1"></label><label>Budget or range<input name="budget" placeholder="Optional"></label></div><label><span>What should we handle?</span><textarea name="notes" rows="7" placeholder="Tell us the idea, venue if known, what you already have, and what you want us to take off your hands."></textarea></label>{% if service.ticketing_available %}<label class="check-row"><input type="checkbox" name="ticketing" value="1"> <span>I also want Open Road to provide digital tickets and QR entry.</span></label>{% endif %}<button class="button primary">Send request</button></form></div></section>{% endblock %}
