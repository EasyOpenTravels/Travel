{% extends 'base.html' %}{% block content %}<section class="form-page"><div class="form-card"><div class="eyebrow">STAFF ONLY</div><h1>Official QR scanner.</h1><p class="lead">No account. Enter the Event Code and the separate Scanner PIN given to you by the event owner.</p><form method="post"><label>Event Code<input name="scanner_code" required placeholder="SCN-XXXXXXXX"></label><label>Scanner PIN<input name="pin" type="password" inputmode="numeric" pattern="[0-9]{4,8}" maxlength="8" required></label><button class="button primary full">Open scanner</button></form><p class="section-note">You will only see the scanner and the event's ticket list. There is no host-management link here.</p></div></section>{% endblock %}
