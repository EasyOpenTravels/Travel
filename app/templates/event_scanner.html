{% extends 'base.html' %}{% block content %}<section class="form-page scanner-login-page"><div class="form-card"><div class="eyebrow">SCANNER ONLY</div><h1>Get to the door.</h1><p class="lead">Enter the event's private scan details. This creates a scanner-only session; there is no organizer access here.</p><form method="post"><label>Your name<input name="scanner_name" required placeholder="e.g. Mike at the door"></label><label>Event Code<input name="scanner_code" required placeholder="SCN-XXXXXXXX"></label><label>Scanner PIN<input name="pin" type="password" inputmode="numeric" pattern="[0-9]{4,8}" maxlength="8" required></label><button class="button primary full">Open scanner</button></form></div></section>{% endblock %}
