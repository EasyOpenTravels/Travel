{% extends 'base.html' %}{% block content %}
<section class="join-page"><div class="join-card"><div class="eyebrow">BRING YOUR CREW</div><h1>Scan. Land here. Pick a place.</h1><p class="lead">This QR opens the Open Road home page. Share it with friends who need a little convincing.</p><div class="join-qr"><img src="data:image/png;base64,{{ qr|b64encode }}" alt="Open Road Adventures QR code"></div><div class="share-actions"><button class="button primary" type="button" id="shareOpenRoad">Share Open Road</button><button class="button secondary" type="button" id="copyOpenRoad">Copy link</button></div><p class="micro">{{ target }}</p></div></section>
{% endblock %}
{% block scripts %}<script>
const target={{ target|tojson }};
const share=async()=>{try{if(navigator.share){await navigator.share({title:'Open Road Adventures',text:'Find a place worth leaving the house for.',url:target)}else{await navigator.clipboard.writeText(target);alert('Open Road link copied.')}}catch(e){}};
document.getElementById('shareOpenRoad')?.addEventListener('click',share);document.getElementById('copyOpenRoad')?.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(target);alert('Link copied.')}catch(e){}});
</script>{% endblock %}
