{% extends 'admin_base.html' %}{% block content %}<section class="admin-wrap"><div class="admin-hero"><div><div class="eyebrow">SERVICE CATALOGUE</div><h1>{{ 'Edit service' if service else 'New service' }}</h1><p>These are the things visitors can discover from the menu.</p></div></div><form class="admin-panel" method="post"><div class="field-grid"><label>Title<input name="title" value="{{ service.title if service else '' }}" required></label><label>Category<input name="category" value="{{ service.category if service else 'Events' }}" required></label><label>Accent<select name="accent"><option value="lime">Lime</option><option value="aqua">Aqua</option><option value="orange">Orange</option><option value="pink">Pink</option><option value="blue">Blue</option><option value="yellow">Yellow</option><option value="teal">Teal</option></select></label></div><label>Subtitle<input name="subtitle" value="{{ service.subtitle if service else '' }}" required></label><label>Description<textarea name="description" rows="6" required>{{ service.description if service else '' }}</textarea></label><label>Cover image URL<input name="cover_image" value="{{ service.cover_image if service else '' }}"></label><label class="check-row"><input type="checkbox" name="ticketing_available" value="1" {% if service and service.ticketing_available %}checked{% endif %}> <span>Offer QR ticketing as part of this service</span></label><label class="check-row"><input type="checkbox" name="published" value="1" {% if not service or service.published %}checked{% endif %}> <span>Show this service publicly</span></label><div class="button-row"><button class="button primary">Save service</button><a class="button secondary" href="{{ url_for('admin.dashboard') }}">Cancel</a></div></form></section>{% endblock %}
